<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <defs>
    <radialGradient id="sky" cx="50%" cy="45%" r="70%">
      <stop offset="0%" stop-color="#1B2350"/>
      <stop offset="100%" stop-color="#0E1430"/>
    </radialGradient>
    <radialGradient id="safeGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFB347" stop-opacity="0.45"/>
      <stop offset="85%" stop-color="#FFE9B0" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#FFE9B0" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Night Sky & Cloud Sea -->
  <rect width="1280" height="720" fill="url(#sky)"/>
  <ellipse cx="640" cy="540" rx="580" ry="155" fill="#12384A" opacity="0.7"/>

  <!-- Island Grass & Sand Rim -->
  <ellipse cx="640" cy="500" rx="450" ry="125" fill="#C9B48A"/>
  <ellipse cx="640" cy="492" rx="430" ry="116" fill="#2F5D50"/>

  <!-- Lit Lantern L1 Safe Zone & Sky Beam -->
  <ellipse cx="440" cy="465" rx="145" ry="44" fill="url(#safeGlow)" stroke="#FFE9B0" stroke-width="2" stroke-dasharray="8 4"/>
  <polygon points="430,425 450,425 468,120 412,120" fill="#FFE9B0" opacity="0.16"/>
  <rect x="435" y="415" width="10" height="50" fill="#6B4A2F"/>
  <rect x="424" y="392" width="32" height="26" rx="4" fill="#FFB347"/>
  <polygon points="416,392 464,392 440,374" fill="#C8102E"/>
  <!-- 3D Fuel Bar on L1 -->
  <rect x="412" y="356" width="56" height="9" rx="3" fill="#0E1430" stroke="#F2C14E" stroke-width="1"/>
  <rect x="414" y="358" width="46" height="5" rx="2" fill="#F2C14E"/>
  <text x="440" y="350" fill="#FFE9B0" font-family="Segoe UI, sans-serif" font-size="13" font-weight="bold" text-anchor="middle">L1 · Fuel 84%</text>

  <!-- Low-Fuel Lantern L2 (< 30, blinking warning) -->
  <rect x="835" y="425" width="10" height="46" fill="#6B4A2F"/>
  <rect x="825" y="404" width="30" height="22" rx="4" fill="#FFB347" opacity="0.75"/>
  <polygon points="818,404 862,404 840,388" fill="#C8102E"/>
  <rect x="812" y="370" width="56" height="9" rx="3" fill="#0E1430" stroke="#FF5A5F" stroke-width="1"/>
  <rect x="814" y="372" width="14" height="5" rx="2" fill="#FF5A5F"/>
  <text x="840" y="364" fill="#FF5A5F" font-family="Segoe UI, sans-serif" font-size="13" font-weight="bold" text-anchor="middle">⚠ L2 · Fuel 22%</text>

  <!-- Shade S1 draining L2 -->
  <polygon points="885,472 915,472 900,422" fill="#120A1A" stroke="#7A3CFF" stroke-width="2"/>
  <circle cx="895" cy="442" r="3.5" fill="#7A3CFF"/>
  <circle cx="905" cy="442" r="3.5" fill="#7A3CFF"/>
  <line x1="892" y1="438" x2="852" y2="416" stroke="#7A3CFF" stroke-width="3" stroke-dasharray="5 3"/>
  <text x="905" y="490" fill="#F5F1E6" font-family="Segoe UI, sans-serif" font-size="13" font-weight="bold" text-anchor="middle">S1 (drain -5/s)</text>

  <!-- Mây (Character at center with Nón Lá & Mini Lantern & Light Pulse) -->
  <ellipse cx="640" cy="495" rx="95" ry="28" fill="none" stroke="#FFE58A" stroke-width="3" opacity="0.8"/>
  <polygon points="622,495 658,495 640,442" fill="#E8E2D0"/>
  <circle cx="640" cy="434" r="11" fill="#FFE9B0"/>
  <polygon points="614,428 666,428 640,410" fill="#E8E2D0" stroke="#C9B48A" stroke-width="1.5"/>
  <circle cx="664" cy="434" r="6" fill="#FFF6C2"/>
  <text x="640" y="516" fill="#FFF6C2" font-family="Segoe UI, sans-serif" font-size="15" font-weight="bold" text-anchor="middle">Mây (Sức chứa 14/20)</text>

  <!-- Top HUD -->
  <rect x="24" y="20" width="330" height="64" rx="14" fill="#0E1430" fill-opacity="0.88" stroke="#F2C14E" stroke-opacity="0.4"/>
  <text x="42" y="46" fill="#F2C14E" font-family="Segoe UI, sans-serif" font-size="18" font-weight="bold">🏮 Đảo Đèn Lồng v1.0.0</text>
  <text x="42" y="68" fill="#8FA3B8" font-family="Segoe UI, sans-serif" font-size="15">Đêm 3 · Đảo Chuông   |   🔥🔥🔥</text>

  <rect x="530" y="20" width="220" height="64" rx="14" fill="#0E1430" fill-opacity="0.88" stroke="#F2C14E" stroke-opacity="0.4"/>
  <text x="640" y="42" fill="#8FA3B8" font-family="Segoe UI, sans-serif" font-size="13" text-anchor="middle">GIỮ ĐẢO SÁNG TỚI BÌNH MINH</text>
  <text x="640" y="70" fill="#F5F1E6" font-family="Segoe UI, sans-serif" font-size="26" font-weight="bold" text-anchor="middle">02:45</text>

  <rect x="910" y="20" width="346" height="64" rx="14" fill="#0E1430" fill-opacity="0.88" stroke="#F2C14E" stroke-opacity="0.4"/>
  <text x="932" y="46" fill="#8FA3B8" font-family="Segoe UI, sans-serif" font-size="14">ĐÈN SÁNG (CẦN ≥ 60%)</text>
  <text x="932" y="68" fill="#F2C14E" font-family="Segoe UI, sans-serif" font-size="18" font-weight="bold">5 / 7 (cần ≥ 5)   ·   Điểm: 1,420</text>

  <!-- Visual Subtitle Banner -->
  <rect x="350" y="575" width="580" height="40" rx="12" fill="#0E1430" fill-opacity="0.92" stroke="#FFE9B0" stroke-width="1.5"/>
  <text x="640" y="601" fill="#F5F1E6" font-family="Segoe UI, sans-serif" font-size="18" font-weight="bold" text-anchor="middle">⚠ Phụ đề: Bóng Mực S1 đang hút dầu đèn L2 (Fuel 22%)!</text>

  <!-- Bottom HUD: Mote Slots & Skills -->
  <rect x="460" y="632" width="360" height="68" rx="14" fill="#0E1430" fill-opacity="0.88" stroke="#F2C14E" stroke-opacity="0.4"/>
  <text x="640" y="655" fill="#F2C14E" font-family="Segoe UI, sans-serif" font-size="16" font-weight="bold" text-anchor="middle">Đom đóm mang / Sức chứa: 8 / 14</text>
  <g transform="translate(490, 668)">
    <rect x="0" y="0" width="22" height="14" rx="3" fill="#FFF6C2"/>
    <rect x="28" y="0" width="22" height="14" rx="3" fill="#FFF6C2"/>
    <rect x="56" y="0" width="22" height="14" rx="3" fill="#FFF6C2"/>
    <rect x="84" y="0" width="22" height="14" rx="3" fill="#FFF6C2"/>
    <rect x="112" y="0" width="22" height="14" rx="3" fill="#FFF6C2"/>
    <rect x="140" y="0" width="22" height="14" rx="3" fill="#FFF6C2"/>
    <rect x="168" y="0" width="22" height="14" rx="3" fill="#FFF6C2"/>
    <rect x="196" y="0" width="22" height="14" rx="3" fill="#FFF6C2"/>
    <rect x="224" y="0" width="22" height="14" rx="3" fill="#5B5F6E" opacity="0.45"/>
    <rect x="252" y="0" width="22" height="14" rx="3" fill="#5B5F6E" opacity="0.45"/>
    <rect x="280" y="0" width="22" height="14" rx="3" fill="#5B5F6E" opacity="0.45"/>
  </g>
</svg>
